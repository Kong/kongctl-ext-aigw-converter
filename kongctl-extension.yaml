schema_version: 1

publisher: kong
name: ai-gateway-converter
summary: Migrate Kong Gateway AI configuration to AI Gateway

runtime:
  command: bin/kongctl-ext-ai-gateway-converter

command_paths:
  - id: convert_ai_gateway
    path:
      - name: convert
      - name: ai-gateway
        aliases:
          - aigw
    summary: Migrate AI Gateway configuration
    description: Migrates decK, Kong Operator, or Terraform configuration into AI Gateway resources.
    usage: kongctl convert ai-gateway --input PATH [flags]
    examples:
      - kongctl convert ai-gateway --input kong.yaml --config ./config --out ./out
    flags:
      - name: input
        type: string
        description: Source decK file, Kong Operator manifests, or Terraform config. Required.
      - name: input-format
        type: string
        description: "Input format: auto (default), deck, kong-operator, terraform."
      - name: source-name
        type: string
        description: Migrated control plane name (defaults to the input filename).
      - name: strict
        type: bool
        description: Fail on migration findings instead of collecting them.
      - name: format
        type: string
        description: "Comma-separated outputs: kongctl (default), deck, kong-operator, terraform."
      - name: operator-gateway
        type: string
        description: "Kong Operator parent: konnect (default) or onprem."
      - name: k8s-namespace
        type: string
        description: Namespace for Kong Operator manifests.
      - name: konnect-server-url
        type: string
        description: Konnect API host for Operator and Terraform (default us.api.konghq.com).
      - name: config
        type: string
        description: Directory holding manual migration config.
      - name: ref
        type: string
        description: Path to an AI Gateway OpenAPI spec override.
      - name: out
        type: string
        description: Output directory for migrated resources.
      - name: label-tag-prefix
        type: string
        description: Tag prefix lifted back into labels.
      - name: namespace-prefix
        type: string
        description: kongctl namespace prefix for generated files.
  - id: convert_ai_gateway_version
    path:
      - name: convert
      - name: ai-gateway
        aliases:
          - aigw
      - name: version
    summary: Show AI Gateway converter version information
    description: Shows the extension and embedded kong-ai-migration-tool versions.
    usage: kongctl convert ai-gateway version
    examples:
      - kongctl convert ai-gateway version
