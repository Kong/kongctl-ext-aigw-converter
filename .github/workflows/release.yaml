name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXTENSION_BINARY: kongctl-ext-ai-gateway-converter
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          build_archive() {
            local goos="$1"
            local goarch="$2"
            local package_dir="dist/package-${goos}-${goarch}"
            local binary="bin/${EXTENSION_BINARY}"
            local archive="dist/${EXTENSION_BINARY}-${goos}-${goarch}.tar.gz"

            mkdir -p "${package_dir}/bin"
            cp kongctl-extension.yaml README.md "${package_dir}/"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -o "${package_dir}/${binary}" "./cmd/${EXTENSION_BINARY}"
            chmod +x "${package_dir}/${binary}"
            tar -C "$package_dir" -czf "$archive" \
              kongctl-extension.yaml README.md "$binary"
          }

          build_archive linux amd64
          build_archive linux arm64
          build_archive darwin amd64
          build_archive darwin arm64

          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
