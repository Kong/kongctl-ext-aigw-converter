name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure private module access
        shell: bash
        env:
          GH_TOKEN_PRIVATE_READ: ${{ secrets.GH_TOKEN_PRIVATE_READ }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN_PRIVATE_READ:-}" ]; then
            echo "::error::GH_TOKEN_PRIVATE_READ is required for kong-ai-migration-tool"
            exit 1
          fi

          git config --global \
            url."https://x-access-token:${GH_TOKEN_PRIVATE_READ}@github.com/".insteadOf \
            "https://github.com/"
          echo "GOPRIVATE=github.com/Kong/kong-ai-migration-tool" >> "${GITHUB_ENV}"
          echo "GONOSUMDB=github.com/Kong/kong-ai-migration-tool" >> "${GITHUB_ENV}"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Build
        run: make build
